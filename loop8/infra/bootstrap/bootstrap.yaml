AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bootstrap for the MavenScout ranking engine POC. Creates what Terraform needs
  before it can run: the Terraform state bucket, the GitHub Actions OIDC
  provider, a read only plan role and a pinned apply role. DRAFT for review,
  not deployed. Run once by the project lead with the admin profile.

Parameters:
  GitHubOrg:
    Type: String
    Default: benjiholzman
    Description: GitHub owner of the repository (a user account)

  GitHubOrgId:
    Type: String
    Default: "270381471"
    Description: >
      Numeric GitHub owner ID. Required because this repository presents the
      immutable OIDC subject repo:OWNER@OWNER-ID/REPO@REPO-ID:... (checked with
      the GitHub API on 2026-11-17, use_immutable_subject is true).

  GitHubRepo:
    Type: String
    Default: mavenscout
    Description: Repository name that is trusted to assume the roles

  GitHubRepoId:
    Type: String
    Default: "1288851291"
    Description: Numeric GitHub repository ID (see GitHubOrgId for why it is needed)

  DeployBranch:
    Type: String
    Default: loop8-develop
    Description: The only branch whose pushes may assume the apply role

  ProjectPrefix:
    Type: String
    Default: mavenscout
    Description: Prefix for resource names

  StateBucketName:
    Type: String
    Default: mavenscout-poc-tfstate
    Description: Terraform state bucket. Bucket names are global, so change it if the name is taken

  PartnerTagValue:
    Type: String
    Default: "pc:8m1j53s4l98quhnwq6wgbhf0l"
    Description: AWS Partner Central funding attribution (aws-apn-id-916873233657 tag, the Loop8 key)

  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      An account can hold only one provider for the GitHub URL. Set to false if
      the account already has one (aws iam list-open-id-connect-providers).

  AllowOpenSearch:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Lets the apply role manage OpenSearch Serverless. Keep false until the
      short build check. Set true for the check, then back to false.

Conditions:
  MakeOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]
  OpenSearchAllowed: !Equals [!Ref AllowOpenSearch, "true"]

Resources:
  # -------------------------------------------------------
  # Terraform state bucket (native S3 locking, no DynamoDB table)
  # -------------------------------------------------------
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref StateBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: aws-apn-id-916873233657
          Value: !Ref PartnerTagValue

  TerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt TerraformStateBucket.Arn
              - !Sub "${TerraformStateBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # -------------------------------------------------------
  # GitHub OIDC provider
  # -------------------------------------------------------
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: aws-apn-id-916873233657
          Value: !Ref PartnerTagValue

  # -------------------------------------------------------
  # Plan role: read only. Trusted for pull requests and for pushes to the
  # deploy branch, so a pull request can show a Terraform plan.
  # -------------------------------------------------------
  PlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectPrefix}-gha-plan"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOidcProvider
                - !Ref GitHubOIDCProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Exact subjects, no wildcard. Immutable format with owner and
                # repository IDs, so a rename or a recreated repository with
                # the same name does not inherit the trust.
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOrg}@${GitHubOrgId}/${GitHubRepo}@${GitHubRepoId}:pull_request"
                  - !Sub "repo:${GitHubOrg}@${GitHubOrgId}/${GitHubRepo}@${GitHubRepoId}:ref:refs/heads/${DeployBranch}"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Policies:
        - PolicyName: !Sub "${ProjectPrefix}-gha-plan-state"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadState
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt TerraformStateBucket.Arn
                  - !Sub "${TerraformStateBucket.Arn}/*"
              # Native locking writes a .tflock object next to the state file.
              - Sid: LockFileOnly
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "${TerraformStateBucket.Arn}/*.tflock"
      Tags:
        - Key: aws-apn-id-916873233657
          Value: !Ref PartnerTagValue

  # -------------------------------------------------------
  # Apply role: pinned to one branch of one repository. Scoped by name
  # prefix to the resources the engine needs.
  # -------------------------------------------------------
  ApplyRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: >
              Two statements cannot be scoped by resource. Lambda event source
              mappings and OpenSearch Serverless security policies have no
              resource level permissions for create. The OpenSearch statement
              is an explicit Deny unless AllowOpenSearch is true.
    Properties:
      RoleName: !Sub "${ProjectPrefix}-gha-apply"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOidcProvider
                - !Ref GitHubOIDCProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}@${GitHubOrgId}/${GitHubRepo}@${GitHubRepoId}:ref:refs/heads/${DeployBranch}"
      Policies:
        - PolicyName: !Sub "${ProjectPrefix}-gha-apply-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TerraformState
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt TerraformStateBucket.Arn
                  - !Sub "${TerraformStateBucket.Arn}/*"

              # Buckets of the engine, by name prefix. The state bucket does not
              # match this prefix, so the role cannot manage it.
              - Sid: EngineBuckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucket*
                  - s3:PutBucket*
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:GetAccelerateConfiguration
                  - s3:GetReplicationConfiguration
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectPrefix}-engine-*"

              - Sid: EngineLambda
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:GetPolicy
                  - lambda:ListVersionsByFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:PublishVersion
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                Resource:
                  - !Sub "arn:aws:lambda:*:${AWS::AccountId}:function:${ProjectPrefix}-engine-*"
              - Sid: EngineEventSourceMappings
                Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                  - lambda:ListEventSourceMappings
                Resource: "*"

              - Sid: EngineQueues
                Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:SetQueueAttributes
                  - sqs:ListQueueTags
                  - sqs:TagQueue
                  - sqs:UntagQueue
                Resource:
                  - !Sub "arn:aws:sqs:*:${AWS::AccountId}:${ProjectPrefix}-engine-*"

              - Sid: EngineTables
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:UpdateTable
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:ListTagsOfResource
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                Resource:
                  - !Sub "arn:aws:dynamodb:*:${AWS::AccountId}:table/${ProjectPrefix}-engine-*"

              # HTTP API resources cannot be scoped by name.
              - Sid: EngineApiGateway
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource:
                  - "arn:aws:apigateway:*::/apis"
                  - "arn:aws:apigateway:*::/apis/*"
                  - "arn:aws:apigateway:*::/tags/*"

              - Sid: EngineLogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                Resource:
                  - !Sub "arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/${ProjectPrefix}-engine-*"
                  - !Sub "arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/${ProjectPrefix}-engine-*:*"
                  - !Sub "arn:aws:logs:*:${AWS::AccountId}:log-group:/${ProjectPrefix}/*"
              - Sid: EngineLogRead
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                Resource: "*"

              - Sid: EngineAlarms
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:ListTagsForResource
                Resource:
                  - !Sub "arn:aws:cloudwatch:*:${AWS::AccountId}:alarm:${ProjectPrefix}-engine-*"
              - Sid: EngineAlarmRead
                Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                Resource: "*"

              - Sid: EngineTopics
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:TagResource
                  - sns:UntagResource
                  - sns:ListTagsForResource
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:GetSubscriptionAttributes
                  - sns:ListSubscriptionsByTopic
                Resource:
                  - !Sub "arn:aws:sns:*:${AWS::AccountId}:${ProjectPrefix}-engine-*"

              # Budgets and their actions. A budget action attaches a deny
              # policy to a role, so the role it runs as is passed to Budgets.
              - Sid: EngineBudgets
                Effect: Allow
                Action:
                  - budgets:ViewBudget
                  - budgets:ModifyBudget
                  - budgets:CreateBudgetAction
                  - budgets:UpdateBudgetAction
                  - budgets:DeleteBudgetAction
                  - budgets:DescribeBudgetAction
                  - budgets:DescribeBudgetActionsForBudget
                  - budgets:TagResource
                  - budgets:UntagResource
                  - budgets:ListTagsForResource
                Resource:
                  - !Sub "arn:aws:budgets::${AWS::AccountId}:budget/${ProjectPrefix}-*"

              # Secret containers only. No value actions on purpose: secret
              # values never go through Terraform or its state.
              - Sid: EngineSecrets
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:UpdateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                Resource:
                  - !Sub "arn:aws:secretsmanager:*:${AWS::AccountId}:secret:${ProjectPrefix}/*"

              # Roles and policies of the engine only. The gha roles of this
              # stack use the prefix ${ProjectPrefix}-gha-, which does not match
              # ${ProjectPrefix}-engine-, and an explicit deny below covers them.
              - Sid: EngineIamManage
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:CreatePolicy
                  - iam:DeletePolicy
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicyVersion
                  - iam:TagPolicy
                  - iam:UntagPolicy
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectPrefix}-engine-*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:policy/${ProjectPrefix}-engine-*"
              # Attaching is limited to the engine's own policies and two
              # managed Lambda execution policies, so the role cannot attach
              # AdministratorAccess to something it creates.
              - Sid: EngineIamAttach
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectPrefix}-engine-*"
                Condition:
                  ArnEquals:
                    iam:PolicyARN:
                      - !Sub "arn:aws:iam::${AWS::AccountId}:policy/${ProjectPrefix}-engine-*"
                      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                      - arn:aws:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole
              - Sid: EngineIamPassRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectPrefix}-engine-*"
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - lambda.amazonaws.com
                      - budgets.amazonaws.com

              - Sid: OpenSearchServerless
                Effect: !If [OpenSearchAllowed, Allow, Deny]
                Action:
                  - aoss:CreateCollection
                  - aoss:DeleteCollection
                  - aoss:UpdateCollection
                  - aoss:BatchGetCollection
                  - aoss:ListCollections
                  - aoss:CreateSecurityPolicy
                  - aoss:DeleteSecurityPolicy
                  - aoss:GetSecurityPolicy
                  - aoss:ListSecurityPolicies
                  - aoss:UpdateSecurityPolicy
                  - aoss:CreateAccessPolicy
                  - aoss:DeleteAccessPolicy
                  - aoss:GetAccessPolicy
                  - aoss:ListAccessPolicies
                  - aoss:UpdateAccessPolicy
                  - aoss:TagResource
                  - aoss:UntagResource
                  - aoss:ListTagsForResource
                Resource: "*"

              # The apply role must not be able to change how it is trusted or
              # what it may do, and must not touch the OIDC provider.
              - Sid: DenySelfAndTrustChanges
                Effect: Deny
                Action:
                  - iam:*
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectPrefix}-gha-*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
      Tags:
        - Key: aws-apn-id-916873233657
          Value: !Ref PartnerTagValue

Outputs:
  PlanRoleArn:
    Description: Value for the repository variable AWS_PLAN_ROLE_ARN
    Value: !GetAtt PlanRole.Arn
  ApplyRoleArn:
    Description: Value for the repository variable AWS_APPLY_ROLE_ARN
    Value: !GetAtt ApplyRole.Arn
  StateBucket:
    Description: Terraform state bucket
    Value: !Ref TerraformStateBucket
